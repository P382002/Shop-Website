<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Sri Vignaraja Fabrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7A1F2B; --maroon-dark:#5C1620; --gold:#C9A227;
    --cream:#FBF6EE; --ink:#2B1B12; --line:#E4D9C6; --ok:#3E7A4B; --warn:#B4531E;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0 0 .3em;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:4px;}
  input,textarea,select{font-family:inherit;padding:.6em .7em;border:1px solid var(--line);border-radius:4px;width:100%;background:#fff;}
  label{font-size:.85em;font-weight:600;display:block;margin-bottom:.25em;color:var(--maroon-dark);}
  .field{margin-bottom:1em;}
  .container{max-width:1100px;margin:0 auto;padding:0 1.2em;}
  header.site{background:var(--maroon-dark);color:#fff;padding:1.1em 0;}
  header.site h1{font-size:1.3em;color:#fff;}
  header.site .sub{font-size:.75em;color:var(--gold);letter-spacing:.08em;}
  main{padding:2em 0 4em;min-height:70vh;}
  .row{display:flex;gap:1em;flex-wrap:wrap;}
  .row > *{flex:1;min-width:180px;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1.5em;margin-bottom:1.5em;}
  .btn{display:inline-block;background:var(--maroon);color:#fff;padding:.7em 1em;border-radius:4px;font-weight:600;text-align:center;text-decoration:none;}
  .btn:hover{background:var(--maroon-dark);}
  .btn.outline{background:transparent;border:1px solid var(--maroon);color:var(--maroon);}
  .btn.wa{background:#25D366;color:#fff;}
  .btn.small{padding:.4em .7em;font-size:.85em;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .linkbtn{background:none;color:var(--maroon);text-decoration:underline;padding:0;font-size:.85em;}
  .tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:6px;}
  table{width:100%;border-collapse:collapse;min-width:720px;}
  th,td{padding:.7em .6em;border-bottom:1px solid var(--line);text-align:left;font-size:.9em;vertical-align:top;}
  th{background:var(--cream);color:var(--maroon-dark);font-size:.8em;text-transform:uppercase;letter-spacing:.04em;}
  .admin-nav{display:flex;gap:.5em;margin-bottom:1.5em;flex-wrap:wrap;align-items:center;}
  .admin-nav a{padding:.5em 1em;border-radius:4px;background:#fff;border:1px solid var(--line);text-decoration:none;font-size:.9em;font-weight:500;}
  .admin-nav a.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}
  .dot{display:inline-block;background:var(--warn);color:#fff;border-radius:20px;padding:0 .5em;font-size:.75em;margin-left:.4em;}
  .badge{display:inline-block;padding:.2em .6em;border-radius:20px;font-size:.75em;font-weight:600;}
  .badge.pending{background:#FCE9D5;color:var(--warn);}
  .badge.confirmed{background:#DCEBFF;color:#1D4E89;}
  .badge.dispatched{background:#E7DCFB;color:#5A32A3;}
  .badge.delivered{background:#DAF0DE;color:var(--ok);}
  .badge.cancelled{background:#F5DADA;color:#A32E2E;}
  .toast{position:fixed;bottom:1.5em;right:1.5em;background:var(--ink);color:#fff;padding:.9em 1.3em;border-radius:6px;font-size:.9em;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.2);}
  .photo-grid{display:flex;gap:.8em;flex-wrap:wrap;margin-top:.7em;}
  .photo-item{width:110px;border:1px solid var(--line);border-radius:6px;padding:.4em;background:#fff;text-align:center;position:relative;}
  .photo-item img{width:100%;height:130px;object-fit:cover;border-radius:4px;display:block;}
  .photo-item .tag{position:absolute;left:.7em;top:.7em;background:var(--maroon);color:#fff;font-size:.7em;padding:.1em .5em;border-radius:20px;}
  .photo-item .acts{display:flex;justify-content:space-between;gap:.3em;margin-top:.4em;}
  .photo-item .acts button{flex:1;font-size:.72em;padding:.3em .2em;}
  .shot-btn{display:block;margin-top:.4em;}
  .shot-modal{position:fixed;inset:0;background:rgba(20,10,6,.92);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1em;}
  .shot-modal img{max-width:100%;max-height:calc(100% - 70px);object-fit:contain;background:#fff;border-radius:4px;}
  .shot-modal .cap{color:#fff;margin-bottom:.7em;font-size:.9em;text-align:center;}
  .shot-modal .x{position:absolute;top:.7em;right:.8em;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:1.5em;line-height:1;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5em;}
  .muted{color:#888;font-size:.85em;}
  .alert{background:#FFF4DC;border:1px solid #F0D48A;color:#7a5b00;padding:.8em 1em;border-radius:6px;margin-bottom:1.2em;font-size:.9em;}
  .login-box{max-width:380px;margin:4em auto;}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, updatePassword }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
         writeBatch, increment, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = document.getElementById('app');

if(firebaseConfig.apiKey.startsWith('PASTE')){
  app.innerHTML = `<div style="max-width:560px;margin:4em auto;padding:1.5em;font-family:sans-serif">
    <h2>Setup needed</h2><p>Open <b>firebase-config.js</b> and paste your Firebase project settings. See README.md for the steps.</p></div>`;
} else {
  start();
}

function start(){
  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);

  /* ---------- State ---------- */
  let user = null, authReady = false;
  let products = [], orders = [];
  let settings = { shopName:'Sri Vignaraja Fabrics', whatsapp:'', upiId:'' };
  let editingId = null;       // product being edited
  let prodQuery = '';         // product search text
  let ordQuery = '', fDate = 'all', fFrom = '', fTo = '', fSource = 'all', fStatus = 'all';  // order search + filters
  let formImages = [];        // photos in the product form (base64), max 4, first = main photo
  let dataError = '';
  let unsubs = [];
  let firstOrdersLoad = true;

  /* ---------- Helpers ---------- */
  function route(){ return location.hash.slice(1) || '/dashboard'; }
  window.addEventListener('hashchange', ()=>{
    editingId = null; formImages = []; prodQuery = '';
    ordQuery = ''; fDate = 'all'; fFrom = ''; fTo = ''; fSource = 'all'; fStatus = 'all';
    render();
  });
  function toast(msg){
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 3000);
  }
  function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function money(n){ return '₹' + Number(n).toLocaleString('en-IN'); }
  function placeholderImg(name){
    const txt = encodeURIComponent((name||'?').slice(0,2).toUpperCase());
    return `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='360'><rect width='100%' height='100%' fill='%23F0E6D6'/><text x='50%' y='50%' font-size='60' fill='%237A1F2B' font-family='sans-serif' text-anchor='middle' dy='.35em'>${txt}</text></svg>`;
  }
  function shortId(o){ return o.id.slice(0,8).toUpperCase(); }
  function fmtTime(o){ return o.time && o.time.toDate ? o.time.toDate().toLocaleString('en-IN') : 'just now'; }
  function authMsg(e){
    const c = e && e.code || '';
    if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-email')) return 'Incorrect email or password';
    if(c.includes('too-many-requests')) return 'Too many attempts. Please wait a few minutes and try again.';
    if(c.includes('network')) return 'Network problem. Check your internet connection.';
    return 'Something went wrong. Please try again.';
  }
  // Resize photo in the browser so it is small enough to store (no paid Storage needed)
  // `src` can be a File or a base64 data URL
  function resizeImage(src, maxW=800, quality=0.7){
    return new Promise((res,rej)=>{
      const img = new Image();
      const isFile = typeof src !== 'string';
      const url = isFile ? URL.createObjectURL(src) : src;
      img.onload = ()=>{
        const sc = Math.min(1, maxW/img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        if(isFile) URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>rej(new Error('bad image'));
      img.src = url;
    });
  }
  const MAX_PHOTOS = 4;
  function imgsOf(p){
    if(Array.isArray(p.images) && p.images.length) return p.images;
    return p.image ? [p.image] : [];
  }
  function thumbOf(p){ return p.image || imgsOf(p)[0] || placeholderImg(p.name); }
  function photoGridHtml(){
    return `${formImages.map((src,i)=>`
      <div class="photo-item">
        ${i===0 ? '<span class="tag">Main</span>' : ''}
        <img src="${src}" alt="Photo ${i+1}">
        <div class="acts">
          ${i>0 ? `<button type="button" class="btn small outline" data-photo-main="${i}">Make main</button>` : ''}
          <button type="button" class="btn small outline" data-photo-del="${i}">Remove</button>
        </div>
      </div>`).join('')}`;
  }
  function renderPhotoGrid(){
    const g = document.getElementById('pf-photos'); if(!g) return;
    g.innerHTML = photoGridHtml();
    const c = document.getElementById('pf-photo-count'); if(c) c.textContent = formImages.length + ' / ' + MAX_PHOTOS + ' photos';
    const inp = document.getElementById('pf-image'); if(inp) inp.disabled = formImages.length >= MAX_PHOTOS;
    g.querySelectorAll('[data-photo-del]').forEach(b=>b.onclick=()=>{ formImages.splice(Number(b.dataset.photoDel),1); renderPhotoGrid(); });
    g.querySelectorAll('[data-photo-main]').forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.photoMain); const [x]=formImages.splice(i,1); formImages.unshift(x); renderPhotoGrid(); });
  }
  function openShot(src, caption){
    const m = document.createElement('div');
    m.className = 'shot-modal';
    m.innerHTML = `<button class="x" aria-label="Close">×</button><div class="cap">${escapeHtml(caption)}</div><img src="${src}" alt="Payment screenshot">`;
    m.onclick = ()=>m.remove();
    document.body.appendChild(m);
  }

  /* ---------- Auth + live data ---------- */
  onAuthStateChanged(auth, u=>{
    user = u; authReady = true;
    unsubs.forEach(f=>f()); unsubs = []; products = []; orders = []; dataError = ''; firstOrdersLoad = true;
    if(u) subscribe();
    render();
  });

  function subscribe(){
    const onErr = e=>{ console.error(e); dataError = 'Permission denied. Make sure your Firestore rules contain this admin email (see README, step 5).'; render(); };
    unsubs.push(onSnapshot(query(collection(db,'products'), orderBy('createdAt','desc')), snap=>{
      products = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      if(['/dashboard','/products'].includes(route())) render();
    }, onErr));
    unsubs.push(onSnapshot(query(collection(db,'orders'), orderBy('time','desc')), snap=>{
      orders = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      if(!firstOrdersLoad){
        snap.docChanges().forEach(ch=>{ if(ch.type==='added' && !ch.doc.metadata.hasPendingWrites) toast('🛍 New order from ' + ch.doc.data().name); });
      }
      firstOrdersLoad = false;
      if(route() === '/orders'){ updateOrdersList(); updateBadge(); }   // keeps the search box focused
      else if(route() === '/dashboard') render();
      else updateBadge();
    }, onErr));
    getDoc(doc(db,'settings','shop')).then(s=>{ if(s.exists()) settings = { ...settings, ...s.data() }; render(); }).catch(()=>{});
  }
  function pendingCount(){ return orders.filter(o=>o.status==='Pending').length; }
  function updateBadge(){
    const el = document.getElementById('order-badge');
    if(el){ const n = pendingCount(); el.textContent = n; el.style.display = n ? 'inline-block' : 'none'; }
  }

  /* ---------- Layout ---------- */
  function header(){
    return `<header class="site"><div class="container">
      <h1>${escapeHtml(settings.shopName)}</h1><div class="sub">ADMIN PANEL</div>
    </div></header>`;
  }
  function adminNav(){
    const items = [['/dashboard','Dashboard'],['/products','Products'],['/orders','Orders'],['/settings','Settings']];
    const cur = route();
    const n = pendingCount();
    return `<div class="admin-nav">
      ${items.map(([h,l])=>`<a href="#${h}" class="${cur===h?'active':''}">${l}${h==='/orders'?`<span class="dot" id="order-badge" style="${n?'':'display:none'}">${n}</span>`:''}</a>`).join('')}
      <button class="btn small outline" style="margin-left:auto" data-logout>Logout</button>
    </div>`;
  }

  function render(){
    let body = '';
    if(!authReady) body = `<div class="muted" style="padding:3em 0;text-align:center">Loading…</div>`;
    else if(!user) body = viewLogin();
    else {
      const r = route();
      const alert = dataError ? `<div class="alert">${escapeHtml(dataError)}</div>` : '';
      body = adminNav() + alert + (
        r === '/products' ? viewProducts() :
        r === '/orders' ? viewOrders() :
        r === '/settings' ? viewSettings() : viewDashboard());
    }
    app.innerHTML = header() + `<main><div class="container">${body}</div></main>`;
    attachHandlers();
  }

  /* ---------- Views ---------- */
  function viewLogin(){
    return `
    <div class="login-box panel">
      <h2 style="text-align:center;">Admin Login</h2>
      <div class="field"><label>Email</label><input id="ad-email" type="email" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="ad-pass" type="password" autocomplete="current-password"></div>
      <button class="btn" style="width:100%" data-login>Login</button>
      <p style="text-align:center;margin-top:1em;"><button class="linkbtn" data-forgot>Forgot password?</button></p>
    </div>`;
  }

  function viewDashboard(){
    const revenue = orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+(o.total||0),0);
    const low = products.filter(p=>p.stock<=2);
    return `
    ${!settings.upiId ? `<div class="alert">Your UPI ID is not set yet. Customers can't pay online until you add it in <a href="#/settings"><b>Settings</b></a>.</div>` : ''}
    ${!settings.whatsapp ? `<div class="alert">Your WhatsApp number is not set yet. Customers can't message you until you add it in <a href="#/settings"><b>Settings</b></a>.</div>` : ''}
    <h2>Dashboard</h2>
    <div class="row">
      <div class="panel"><div class="muted">Total Products</div><h2>${products.length}</h2></div>
      <div class="panel"><div class="muted">Total Orders</div><h2>${orders.length}</h2></div>
      <div class="panel"><div class="muted">Pending Orders</div><h2 style="color:var(--warn)">${pendingCount()}</h2></div>
      <div class="panel"><div class="muted">Revenue (non-cancelled)</div><h2>${money(revenue)}</h2></div>
    </div>
    <div class="panel">
      <h3 style="font-size:1em;">Low Stock (2 or fewer)</h3>
      ${low.map(p=>`<div class="flex-between"><span>${escapeHtml(p.name)}</span><span>${Math.max(0,p.stock)} left</span></div>`).join('') || '<span class="muted">None — stock levels are healthy.</span>'}
    </div>`;
  }

  function viewProducts(){
    const ed = editingId ? products.find(p=>p.id===editingId) : null;
    return `
    <h2>Products</h2>
    <div class="panel">
      <h3 style="font-size:1em;">${ed ? 'Edit Product' : 'Add New Product'}</h3>
      <div class="row">
        <div class="field"><label>Name</label><input id="pf-name" value="${escapeHtml(ed?.name)}"></div>
        <div class="field"><label>Price (₹)</label><input id="pf-price" type="number" min="0" value="${ed ? ed.price : ''}"></div>
        <div class="field"><label>Stock Quantity</label><input id="pf-stock" type="number" min="0" value="${ed ? ed.stock : ''}"></div>
      </div>
      <div class="field"><label>Description</label><textarea id="pf-desc" rows="2">${escapeHtml(ed?.desc)}</textarea></div>
      <div class="field">
        <label>Product Photos (up to ${MAX_PHOTOS}) <span class="muted" id="pf-photo-count">${formImages.length} / ${MAX_PHOTOS} photos</span></label>
        <input id="pf-image" type="file" accept="image/*" multiple ${formImages.length>=MAX_PHOTOS?'disabled':''}>
        <div class="muted" style="margin-top:.3em;">Add 1 to ${MAX_PHOTOS} photos. The first photo is shown on the shop page; customers can tap a saree to see all its photos. Use "Make main" to change the first one.</div>
        <div class="photo-grid" id="pf-photos">${photoGridHtml()}</div>
      </div>
      <button class="btn" data-save-product>${ed ? 'Save Changes' : 'Add Product'}</button>
      ${ed ? `<button class="btn outline" data-cancel-edit style="margin-left:.5em">Cancel</button>` : ''}
    </div>
    ${products.length === 0 ? '<div class="panel muted">No products yet — add your first one above.</div>' : `
    <div class="panel" style="padding:1em;">
      <label for="prod-search">Search products</label>
      <input id="prod-search" type="search" placeholder="Search by product name or description" value="${escapeHtml(prodQuery)}">
    </div>
    <div id="prod-list">${productsTableHtml()}</div>`}`;
  }

  function productsTableHtml(){
    const q = prodQuery.trim().toLowerCase();
    const list = q ? products.filter(p=>(String(p.name||'')+' '+String(p.desc||'')).toLowerCase().includes(q)) : products;
    if(!list.length) return `<div class="panel muted">No products match "${escapeHtml(prodQuery)}".</div>`;
    return `
    ${q ? `<div class="muted" style="margin-bottom:.5em;">Showing ${list.length} of ${products.length} products</div>` : ''}
    <div class="tablewrap"><table>
      <thead><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th>Description</th><th>Actions</th></tr></thead>
      <tbody>
        ${list.map(p=>`
          <tr>
            <td><img src="${thumbOf(p)}" style="width:44px;height:54px;object-fit:cover;border-radius:3px;">${imgsOf(p).length>1?`<div class="muted" style="font-size:.7em;">${imgsOf(p).length} photos</div>`:''}</td>
            <td>${escapeHtml(p.name)}</td>
            <td>${money(p.price)}</td>
            <td>${Math.max(0,p.stock)}</td>
            <td style="max-width:240px;font-size:.8em;">${escapeHtml(p.desc)}</td>
            <td style="white-space:nowrap">
              <button class="btn small" data-edit="${p.id}">Edit</button>
              <button class="btn small outline" data-delete="${p.id}">Delete</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
  }

  /* ---------- Order search + filters ---------- */
  function orderDate(o){ return o.time && o.time.toDate ? o.time.toDate() : new Date(); }
  function dateMatch(o){
    if(fDate === 'all') return true;
    const d = orderDate(o), now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if(fDate === 'today') return d >= today;
    if(fDate === 'yesterday'){ const y = new Date(today); y.setDate(y.getDate()-1); return d >= y && d < today; }
    if(fDate === 'week'){ const w = new Date(today); w.setDate(w.getDate()-6); return d >= w; }   // today + previous 6 days
    if(fDate === 'month') return d >= new Date(now.getFullYear(), now.getMonth(), 1);
    if(fDate === 'custom'){
      if(fFrom && d < new Date(fFrom + 'T00:00:00')) return false;
      if(fTo && d > new Date(fTo + 'T23:59:59.999')) return false;
    }
    return true;
  }
  function filteredOrders(){
    const q = ordQuery.trim().toLowerCase();
    return orders.filter(o=>{
      if(q){
        const hay = [shortId(o), o.id, o.name, o.phone].map(x=>String(x||'').toLowerCase());
        if(!hay.some(h=>h.includes(q))) return false;
      }
      if(!dateMatch(o)) return false;
      if(fSource !== 'all' && o.payment !== fSource) return false;
      if(fStatus !== 'all' && o.status !== fStatus) return false;
      return true;
    });
  }
  function filtersActive(){ return ordQuery.trim() || fDate !== 'all' || fSource !== 'all' || fStatus !== 'all'; }

  function ordersListHtml(){
    const statuses = ['Pending','Confirmed','Dispatched','Delivered','Cancelled'];
    const list = filteredOrders();
    const badRange = fDate === 'custom' && fFrom && fTo && fFrom > fTo;
    if(!list.length) return `<div class="panel muted">${badRange ? 'The end date is before the start date.' : 'No orders match your search or filters.'}
      ${filtersActive() ? ' <button class="linkbtn" data-clear-filters>Clear search and filters</button>' : ''}</div>`;
    return `
    <div class="muted" style="margin-bottom:.5em;">Showing ${list.length} of ${orders.length} orders
      ${filtersActive() ? ' · <button class="linkbtn" data-clear-filters>Clear search and filters</button>' : ''}</div>
    <div class="tablewrap"><table>
      <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead>
      <tbody>
      ${list.map(o=>`
        <tr>
          <td><b>${shortId(o)}</b><div class="muted">${fmtTime(o)}</div></td>
          <td>${escapeHtml(o.name)}
            <div class="muted">📞 ${escapeHtml(o.phone)}</div>
            <div class="muted">${escapeHtml(o.address)}</div>
            <a class="btn wa small" style="margin-top:.4em" target="_blank" rel="noopener"
               href="https://wa.me/91${encodeURIComponent(o.phone)}?text=${encodeURIComponent('Hello '+o.name+', this is '+settings.shopName+' regarding your order '+shortId(o)+'.')}">WhatsApp customer</a></td>
          <td>${(o.items||[]).map(i=>`${escapeHtml(i.name)} × ${i.qty}`).join('<br>')}</td>
          <td>${money(o.total)}</td>
          <td>${o.payment==='whatsapp'?'WhatsApp':o.payment==='cod'?'COD':'Online (UPI)'}
            ${o.screenshot ? `<button class="btn small outline shot-btn" data-shot="${o.id}">View payment screenshot</button>` : (o.payment==='online' ? '<div class="muted">No screenshot</div>' : '')}
          </td>
          <td>
            <span class="badge ${String(o.status).toLowerCase()}">${escapeHtml(o.status)}</span><br>
            ${o.payment==='online' && o.status==='Pending' ? `<button class="btn small" style="margin-top:.4em" data-confirm-pay="${o.id}">✔ Payment received, confirm order</button><br>` : ''}
            <select data-status="${o.id}" style="margin-top:.4em;width:auto;">
              ${statuses.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${s}</option>`).join('')}
            </select>
          </td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
  }
  function updateOrdersList(){
    const el = document.getElementById('orders-list');
    if(!el){ render(); return; }
    el.innerHTML = ordersListHtml();
    attachHandlers();
  }

  function viewOrders(){
    const sel = (cur, val) => cur === val ? 'selected' : '';
    return `
    <h2>Orders</h2>
    ${orders.length===0 ? '<div class="panel muted">No orders yet. New orders appear here automatically.</div>' : `
    <div class="panel" style="padding:1em;">
      <div class="field" style="margin-bottom:.8em;">
        <label for="of-search">Search orders</label>
        <input id="of-search" type="search" placeholder="Search using Order ID, customer name, or phone number" value="${escapeHtml(ordQuery)}">
      </div>
      <div class="row">
        <div class="field" style="margin-bottom:.5em;"><label for="of-date">Date</label>
          <select id="of-date">
            <option value="all" ${sel(fDate,'all')}>All orders</option>
            <option value="today" ${sel(fDate,'today')}>Today</option>
            <option value="yesterday" ${sel(fDate,'yesterday')}>Yesterday</option>
            <option value="week" ${sel(fDate,'week')}>Last week (past 7 days)</option>
            <option value="month" ${sel(fDate,'month')}>This month</option>
            <option value="custom" ${sel(fDate,'custom')}>Custom date</option>
          </select></div>
        <div class="field" style="margin-bottom:.5em;"><label for="of-source">Order Source</label>
          <select id="of-source">
            <option value="all" ${sel(fSource,'all')}>All sources</option>
            <option value="whatsapp" ${sel(fSource,'whatsapp')}>WhatsApp</option>
            <option value="online" ${sel(fSource,'online')}>Online payment</option>
          </select></div>
        <div class="field" style="margin-bottom:.5em;"><label for="of-status">Order Status</label>
          <select id="of-status">
            <option value="all" ${sel(fStatus,'all')}>All status</option>
            <option value="Pending" ${sel(fStatus,'Pending')}>Pending</option>
            <option value="Confirmed" ${sel(fStatus,'Confirmed')}>Confirmed</option>
            <option value="Cancelled" ${sel(fStatus,'Cancelled')}>Cancelled</option>
          </select></div>
      </div>
      <div class="row" id="of-custom" style="display:${fDate==='custom'?'flex':'none'};">
        <div class="field" style="margin-bottom:.5em;"><label for="of-from">Start date</label><input type="date" id="of-from" value="${escapeHtml(fFrom)}"></div>
        <div class="field" style="margin-bottom:.5em;"><label for="of-to">End date</label><input type="date" id="of-to" value="${escapeHtml(fTo)}"></div>
      </div>
    </div>
    <div id="orders-list">${ordersListHtml()}</div>
    <p class="muted" style="margin-top:.8em"><b>UPI orders:</b> open the payment screenshot, check the money in your UPI app / bank, then press "Payment received, confirm order". The customer's page then shows that the order is received and will arrive in 3-4 working days.</p>
    <p class="muted" style="margin-top:.8em">Stock is reduced automatically when you move an order out of "Pending" (to Confirmed etc.), and restored if you cancel it. Dispatched and Delivered orders appear under "All status".</p>`}`;
  }

  function viewSettings(){
    return `
    <h2>Settings</h2>
    <div class="panel">
      <h3 style="font-size:1em;">Shop Details</h3>
      <div class="field"><label>Shop Name</label><input id="st-name" value="${escapeHtml(settings.shopName)}"></div>
      <div class="field"><label>WhatsApp Number (country code + number, digits only, e.g. 919876543210)</label><input id="st-whatsapp" value="${escapeHtml(settings.whatsapp)}"></div>
      <div class="field"><label>UPI ID / UPI number (shown to customers for online payment)</label><input id="st-upi" value="${escapeHtml(settings.upiId)}"></div>
      <button class="btn" data-save-settings>Save Details</button>
    </div>
    <div class="panel">
      <h3 style="font-size:1em;">Change Password</h3>
      <p class="muted">Logged in as ${escapeHtml(user.email)}</p>
      <div class="field"><label>New Password (min 6 characters)</label><input id="st-pass" type="password" autocomplete="new-password"></div>
      <button class="btn" data-save-pass>Update Password</button>
    </div>`;
  }

  /* ---------- Order status + stock ---------- */
  async function setStatus(order, newStatus){
    const batch = writeBatch(db);
    let deducted = !!order.stockDeducted;
    const existing = id => products.some(p=>p.id===id);
    if(newStatus !== 'Pending' && newStatus !== 'Cancelled' && !deducted){
      (order.items||[]).forEach(i=>{ if(existing(i.id)) batch.update(doc(db,'products',i.id), { stock: increment(-i.qty) }); });
      deducted = true;
    } else if((newStatus === 'Cancelled' || newStatus === 'Pending') && deducted){
      (order.items||[]).forEach(i=>{ if(existing(i.id)) batch.update(doc(db,'products',i.id), { stock: increment(i.qty) }); });
      deducted = false;
    }
    batch.update(doc(db,'orders',order.id), { status:newStatus, stockDeducted:deducted });
    await batch.commit();
  }

  /* ---------- Handlers ---------- */
  function attachHandlers(){
    const emailEl = document.getElementById('ad-email');
    const passEl = document.getElementById('ad-pass');
    const doLogin = async ()=>{
      const btn = document.querySelector('[data-login]');
      btn.disabled = true;
      try{ await signInWithEmailAndPassword(auth, emailEl.value.trim(), passEl.value); }
      catch(e){ toast(authMsg(e)); btn.disabled = false; }
    };
    const loginBtn = document.querySelector('[data-login]');
    if(loginBtn){ loginBtn.onclick = doLogin; passEl.onkeydown = e=>{ if(e.key==='Enter') doLogin(); }; }

    const forgot = document.querySelector('[data-forgot]');
    if(forgot) forgot.onclick = async ()=>{
      const email = emailEl.value.trim();
      if(!email){ toast('Enter your email above first'); return; }
      try{ await sendPasswordResetEmail(auth, email); toast('Password reset email sent (check spam too)'); }
      catch(e){ toast(authMsg(e)); }
    };

    const logout = document.querySelector('[data-logout]');
    if(logout) logout.onclick = ()=>{ signOut(auth); location.hash = ''; };

    // products
    const imgInput = document.getElementById('pf-image');
    if(imgInput){
      renderPhotoGrid();
      imgInput.onchange = async ()=>{
        const files = Array.from(imgInput.files || []);
        imgInput.value = '';
        if(!files.length) return;
        const room = MAX_PHOTOS - formImages.length;
        if(files.length > room) toast('Only ' + MAX_PHOTOS + ' photos allowed per saree');
        for(const f of files.slice(0, room)){
          try{
            let data = await resizeImage(f, 800, 0.7);
            if(data.length > 230000) data = await resizeImage(data, 650, 0.6);
            formImages.push(data);
          }catch(e){ toast('Could not read one of the images'); }
        }
        renderPhotoGrid();
      };
    }
    const saveProd = document.querySelector('[data-save-product]');
    if(saveProd) saveProd.onclick = async ()=>{
      const name = document.getElementById('pf-name').value.trim();
      const price = Number(document.getElementById('pf-price').value);
      const stock = Number(document.getElementById('pf-stock').value) || 0;
      const desc = document.getElementById('pf-desc').value.trim();
      if(!name || !(price > 0)){ toast('Please enter a name and a price'); return; }
      const ed = editingId ? products.find(p=>p.id===editingId) : null;
      const images = formImages.slice(0, MAX_PHOTOS);
      saveProd.disabled = true;
      try{
        // small picture of the first photo, used on the shop cards so the page loads fast
        const image = images.length ? await resizeImage(images[0], 400, 0.65) : '';
        const size = images.reduce((n,x)=>n+x.length,0) + image.length;
        if(size > 900000){ toast('Photos are too large together. Remove one or use smaller photos.'); saveProd.disabled = false; return; }
        if(ed){ await updateDoc(doc(db,'products',ed.id), { name, price, stock, desc, images, image }); toast('Product updated'); }
        else { await addDoc(collection(db,'products'), { name, price, stock, desc, images, image, createdAt: serverTimestamp() }); toast('Product added, customers can see it now'); }
        editingId = null; formImages = []; render();
      }catch(e){ console.error(e); toast('Could not save product (check Firestore rules)'); saveProd.disabled = false; }
    };
    const cancelEdit = document.querySelector('[data-cancel-edit]');
    if(cancelEdit) cancelEdit.onclick = ()=>{ editingId = null; formImages = []; render(); };
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
      editingId = b.dataset.edit;
      const p = products.find(x=>x.id===editingId);
      formImages = p ? imgsOf(p).slice(0, MAX_PHOTOS) : [];
      render(); window.scrollTo({top:0, behavior:'smooth'});
    });
    document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async ()=>{
      if(!confirm('Delete this product? Customers will no longer see it.')) return;
      try{ await deleteDoc(doc(db,'products',b.dataset.delete)); toast('Deleted'); }
      catch(e){ toast('Could not delete'); }
    });

    // product search (only the table refreshes, so typing is never interrupted)
    const ps = document.getElementById('prod-search');
    if(ps) ps.oninput = ()=>{
      prodQuery = ps.value;
      document.getElementById('prod-list').innerHTML = productsTableHtml();
      attachHandlers();
    };

    // order search + filters
    const os = document.getElementById('of-search');
    if(os) os.oninput = ()=>{ ordQuery = os.value; updateOrdersList(); };
    const od = document.getElementById('of-date');
    if(od) od.onchange = ()=>{
      fDate = od.value;
      document.getElementById('of-custom').style.display = fDate === 'custom' ? 'flex' : 'none';
      updateOrdersList();
    };
    const osrc = document.getElementById('of-source');
    if(osrc) osrc.onchange = ()=>{ fSource = osrc.value; updateOrdersList(); };
    const ost = document.getElementById('of-status');
    if(ost) ost.onchange = ()=>{ fStatus = ost.value; updateOrdersList(); };
    const ofr = document.getElementById('of-from');
    if(ofr) ofr.onchange = ()=>{ fFrom = ofr.value; updateOrdersList(); };
    const oto = document.getElementById('of-to');
    if(oto) oto.onchange = ()=>{ fTo = oto.value; updateOrdersList(); };
    document.querySelectorAll('[data-clear-filters]').forEach(b=>b.onclick=()=>{
      ordQuery = ''; fDate = 'all'; fFrom = ''; fTo = ''; fSource = 'all'; fStatus = 'all'; render();
    });

    // orders
    document.querySelectorAll('[data-status]').forEach(sel=>sel.onchange=async ()=>{
      const o = orders.find(x=>x.id===sel.dataset.status);
      if(!o) return;
      try{ await setStatus(o, sel.value); toast('Order ' + shortId(o) + ' → ' + sel.value); }
      catch(e){ console.error(e); toast('Could not update the order'); render(); }
    });

    document.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>{
      const o = orders.find(x=>x.id===b.dataset.shot);
      if(o && o.screenshot) openShot(o.screenshot, 'Order ' + shortId(o) + ' · ' + o.name + ' · ' + money(o.total));
    });
    document.querySelectorAll('[data-confirm-pay]').forEach(b=>b.onclick=async ()=>{
      const o = orders.find(x=>x.id===b.dataset.confirmPay);
      if(!o) return;
      if(!confirm('Confirm that you received ' + money(o.total) + ' from ' + o.name + '?')) return;
      b.disabled = true;
      try{ await setStatus(o, 'Confirmed'); toast('Order ' + shortId(o) + ' confirmed. Customer will see the update.'); }
      catch(e){ console.error(e); toast('Could not confirm the order'); b.disabled = false; }
    });

    // settings
    const saveSettings = document.querySelector('[data-save-settings]');
    if(saveSettings) saveSettings.onclick = async ()=>{
      const next = {
        shopName: document.getElementById('st-name').value.trim() || settings.shopName,
        whatsapp: document.getElementById('st-whatsapp').value.replace(/\D/g,''),
        upiId: document.getElementById('st-upi').value.trim()
      };
      try{ await setDoc(doc(db,'settings','shop'), next); settings = next; toast('Settings saved'); render(); }
      catch(e){ toast('Could not save settings'); }
    };
    const savePass = document.querySelector('[data-save-pass]');
    if(savePass) savePass.onclick = async ()=>{
      const pw = document.getElementById('st-pass').value;
      if(pw.length < 6){ toast('Password must be at least 6 characters'); return; }
      try{ await updatePassword(auth.currentUser, pw); toast('Password updated'); document.getElementById('st-pass').value=''; }
      catch(e){
        if((e.code||'').includes('requires-recent-login')) toast('Please logout and login again, then change the password');
        else toast('Could not update password');
      }
    };
  }

  render();
}
</script>
</body>
</html>
