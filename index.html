<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sri Vignaraja Fabrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7A1F2B; --maroon-dark:#5C1620; --gold:#C9A227;
    --cream:#FBF6EE; --ink:#2B1B12; --line:#E4D9C6; --ok:#3E7A4B;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0 0 .3em;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:4px;}
  input,textarea{font-family:inherit;padding:.6em .7em;border:1px solid var(--line);border-radius:4px;width:100%;background:#fff;}
  label{font-size:.85em;font-weight:600;display:block;margin-bottom:.25em;color:var(--maroon-dark);}
  .field{margin-bottom:1em;}
  .container{max-width:1100px;margin:0 auto;padding:0 1.2em;}
  header.site{background:var(--maroon);color:#fff;padding:1.1em 0;position:sticky;top:0;z-index:20;}
  header.site .container{display:flex;align-items:center;justify-content:space-between;}
  header.site h1{font-size:1.4em;color:#fff;letter-spacing:.02em;}
  header.site .sub{font-size:.75em;color:var(--gold);letter-spacing:.08em;}
  nav.top a{color:#fff;text-decoration:none;margin-left:1.3em;font-size:.9em;font-weight:500;}
  nav.top .cart-count{background:var(--gold);color:var(--maroon-dark);border-radius:50%;padding:.05em .5em;font-size:.8em;margin-left:.3em;font-weight:700;}
  main{padding:2em 0 4em;min-height:60vh;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.4em;}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;}
  .card img{width:100%;height:230px;object-fit:cover;background:#eee;}
  .card .body{padding:1em;display:flex;flex-direction:column;gap:.4em;flex:1;}
  .card .name{font-family:'Fraunces',serif;font-size:1.1em;}
  .card .price{color:var(--maroon);font-weight:700;font-size:1.15em;}
  .card .stock{font-size:.8em;color:#777;}
  .card .desc{font-size:.85em;color:#555;flex:1;}
  .btn{display:inline-block;background:var(--maroon);color:#fff;padding:.7em 1em;border-radius:4px;font-weight:600;text-align:center;text-decoration:none;}
  .btn:hover{background:var(--maroon-dark);}
  .btn.gold{background:var(--gold);color:var(--maroon-dark);}
  .btn.wa{background:#25D366;color:#fff;}
  .btn.outline{background:transparent;border:1px solid var(--maroon);color:var(--maroon);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .empty{text-align:center;padding:3em 1em;color:#888;}
  .row{display:flex;gap:1em;flex-wrap:wrap;}
  .row > *{flex:1;min-width:220px;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1.5em;margin-bottom:1.5em;}
  .cart-row{display:flex;align-items:center;gap:1em;padding:.8em 0;border-bottom:1px solid var(--line);}
  .cart-row img{width:60px;height:75px;object-fit:cover;border-radius:4px;background:#eee;}
  .cart-row .info{flex:1;}
  .qty-ctrl{display:flex;align-items:center;gap:.5em;}
  .qty-ctrl button{width:28px;height:28px;background:var(--cream);border:1px solid var(--line);}
  .total-line{display:flex;justify-content:space-between;font-size:1.2em;font-weight:700;padding:1em 0;border-top:2px solid var(--maroon);margin-top:.5em;}
  .pay-opt{border:1px solid var(--line);border-radius:6px;padding:1em;margin-bottom:.7em;cursor:pointer;display:flex;gap:.8em;align-items:flex-start;}
  .pay-opt.selected{border-color:var(--maroon);background:#FDF3E7;}
  .pay-opt input{width:auto;margin-top:.2em;}
  .note{font-size:.8em;color:#777;margin-top:.3em;}
  footer{background:var(--maroon-dark);color:#e9d9c6;padding:2em 0;font-size:.85em;text-align:center;}
  .toast{position:fixed;bottom:1.5em;right:1.5em;background:var(--ink);color:#fff;padding:.9em 1.3em;border-radius:6px;font-size:.9em;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.2);}
  .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5em;}
  .muted{color:#888;font-size:.85em;}
  @media(max-width:640px){
    header.site .container{flex-direction:column;gap:.5em;align-items:flex-start;}
    nav.top{width:100%;display:flex;justify-content:space-between;}
    nav.top a{margin-left:0;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = document.getElementById('app');

if(firebaseConfig.apiKey.startsWith('PASTE')){
  app.innerHTML = `<div style="max-width:560px;margin:4em auto;padding:1.5em;font-family:sans-serif">
    <h2>Setup needed</h2><p>Open <b>firebase-config.js</b> and paste your Firebase project settings. See README.md for the steps.</p></div>`;
} else {
  start();
}

function start(){
  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);

  /* ---------- State ---------- */
  let products = [];
  let productsLoaded = false;
  let loadError = false;
  let settings = { shopName:'Sri Vignaraja Fabrics', whatsapp:'', upiId:'' };
  let cart = [];
  try{ cart = JSON.parse(localStorage.getItem('svf_cart') || '[]'); }catch(e){ cart = []; }
  function saveCart(){ try{ localStorage.setItem('svf_cart', JSON.stringify(cart)); }catch(e){} }

  /* ---------- Live data from Firebase ---------- */
  onSnapshot(query(collection(db,'products'), orderBy('createdAt','desc')), snap=>{
    products = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    productsLoaded = true; loadError = false;
    // drop cart lines whose product was removed
    cart = cart.filter(c=>products.some(p=>p.id===c.id));
    saveCart();
    softRender();
  }, err=>{ console.error(err); loadError = true; productsLoaded = true; softRender(); });

  onSnapshot(doc(db,'settings','shop'), snap=>{
    if(snap.exists()) settings = { ...settings, ...snap.data() };
    softRender();
  }, ()=>{});

  // don't wipe the checkout form while the customer is typing
  function softRender(){ if(route() !== '/checkout') render(); }

  /* ---------- Routing ---------- */
  function route(){ return location.hash.slice(1) || '/'; }
  window.addEventListener('hashchange', render);
  function go(h){ if(location.hash.slice(1) === h){ render(); } else { location.hash = h; } }

  function toast(msg){
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2600);
  }

  /* ---------- Cart helpers ---------- */
  function addToCart(id){
    const p = products.find(x=>x.id===id);
    if(!p || p.stock <= 0) return;
    const line = cart.find(c=>c.id===id);
    const currentQty = line ? line.qty : 0;
    if(currentQty >= p.stock){ toast('No more stock available'); return; }
    if(line){ line.qty++; } else { cart.push({id, qty:1}); }
    saveCart(); render(); toast(p.name + ' added to cart');
  }
  function changeQty(id, delta){
    const line = cart.find(c=>c.id===id);
    const p = products.find(x=>x.id===id);
    if(!line || !p) return;
    line.qty += delta;
    if(line.qty > p.stock) line.qty = p.stock;
    if(line.qty <= 0){ cart = cart.filter(c=>c.id!==id); }
    saveCart(); render();
  }
  function cartTotal(){
    return cart.reduce((sum,c)=>{ const p = products.find(x=>x.id===c.id); return sum + (p? p.price*c.qty : 0); }, 0);
  }
  function cartCount(){ return cart.reduce((s,c)=>s+c.qty,0); }

  /* ---------- Helpers ---------- */
  function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function money(n){ return '₹' + Number(n).toLocaleString('en-IN'); }
  function placeholderImg(name){
    const txt = encodeURIComponent((name||'?').slice(0,2).toUpperCase());
    return `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='360'><rect width='100%' height='100%' fill='%23F0E6D6'/><text x='50%' y='50%' font-size='60' fill='%237A1F2B' font-family='sans-serif' text-anchor='middle' dy='.35em'>${txt}</text></svg>`;
  }

  /* ---------- Layout ---------- */
  function header(){
    return `
    <header class="site"><div class="container">
      <div>
        <h1>${escapeHtml(settings.shopName)}</h1>
        <div class="sub">SAREES &amp; ETHNIC WEAR</div>
      </div>
      <nav class="top">
        <a href="#/">Shop</a>
        <a href="#/cart">Cart${cartCount()? `<span class="cart-count">${cartCount()}</span>`:''}</a>
      </nav>
    </div></header>`;
  }
  function footer(){
    return `<footer>© ${new Date().getFullYear()} ${escapeHtml(settings.shopName)} — Handpicked sarees, delivered with care.</footer>`;
  }

  function render(){
    const r = route();
    let body = '';
    if(r === '/') body = viewShop();
    else if(r === '/cart') body = viewCart();
    else if(r === '/checkout') body = viewCheckout();
    else if(r === '/order-success') body = viewOrderSuccess();
    else body = `<div class="empty">Page not found. <a href="#/">Go to shop</a></div>`;
    app.innerHTML = header() + `<main><div class="container">${body}</div></main>` + footer();
    attachHandlers();
  }

  /* ---------- Views ---------- */
  function viewShop(){
    if(!productsLoaded) return `<div class="empty">Loading sarees…</div>`;
    if(loadError) return `<div class="empty">Could not load products. Please refresh the page.</div>`;
    if(products.length === 0) return `<div class="empty">No products yet. Please check back soon.</div>`;
    return `
    <h2 style="margin-bottom:1em;">Our Collection</h2>
    <div class="grid">
      ${products.map(p=>`
        <div class="card">
          <img src="${p.image || placeholderImg(p.name)}" alt="${escapeHtml(p.name)}">
          <div class="body">
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="price">${money(p.price)}</div>
            <div class="desc">${escapeHtml(p.desc)}</div>
            <div class="stock">${p.stock>0 ? p.stock+' in stock' : '<span style="color:#A32E2E">Out of stock</span>'}</div>
            <button class="btn" data-add="${p.id}" ${p.stock<=0?'disabled':''}>Add to Cart</button>
          </div>
        </div>`).join('')}
    </div>`;
  }

  function viewCart(){
    if(cart.length===0) return `<div class="empty">Your cart is empty. <a href="#/">Browse sarees</a></div>`;
    return `
    <h2>Your Cart</h2>
    ${cart.map(c=>{
      const p = products.find(x=>x.id===c.id);
      if(!p) return '';
      return `<div class="cart-row">
        <img src="${p.image || placeholderImg(p.name)}">
        <div class="info">
          <div style="font-weight:600">${escapeHtml(p.name)}</div>
          <div class="muted">${money(p.price)} each</div>
        </div>
        <div class="qty-ctrl">
          <button data-qty-minus="${p.id}">−</button>
          <span>${c.qty}</span>
          <button data-qty-plus="${p.id}">+</button>
        </div>
        <div style="width:90px;text-align:right;font-weight:700">${money(p.price*c.qty)}</div>
      </div>`;
    }).join('')}
    <div class="total-line"><span>Total</span><span>${money(cartTotal())}</span></div>
    <div style="text-align:right;margin-top:1em;">
      <a href="#/" class="btn outline" style="margin-right:.6em;">Continue Shopping</a>
      <button class="btn gold" data-place-order>Place Order</button>
    </div>`;
  }

  function viewCheckout(){
    if(cart.length===0) return `<div class="empty">Your cart is empty. <a href="#/">Browse sarees</a></div>`;
    return `
    <h2>Delivery Details</h2>
    <div class="row">
      <div class="panel" style="flex:2;">
        <div class="field"><label>Full Name</label><input id="ck-name" placeholder="e.g. Uma" maxlength="100"></div>
        <div class="field"><label>Phone Number</label><input id="ck-phone" inputmode="numeric" placeholder="10-digit mobile number" maxlength="10"></div>
        <div class="field"><label>Delivery Address</label><textarea id="ck-address" rows="3" maxlength="500" placeholder="House no, street, city, pincode"></textarea></div>
        <label>Payment Option</label>
        <label class="pay-opt selected">
          <input type="radio" name="pay" value="whatsapp" checked>
          <div><b>WhatsApp Order</b><div class="note">Send your order to us on WhatsApp. We'll confirm availability, final price and delivery, then arrange payment or COD.</div></div>
        </label>
        <label class="pay-opt">
          <input type="radio" name="pay" value="cod">
          <div><b>Cash on Delivery</b><div class="note">Pay in cash when your order is delivered.</div></div>
        </label>
        <label class="pay-opt">
          <input type="radio" name="pay" value="online">
          <div><b>Online Payment (UPI)</b><div class="note">We'll share a UPI/payment link after confirming your order. ${settings.upiId? 'UPI ID: '+escapeHtml(settings.upiId):''}</div></div>
        </label>
        <button class="btn" style="width:100%;margin-top:1em;" data-confirm-order>Confirm Order</button>
      </div>
      <div class="panel" style="flex:1;">
        <h3 style="font-size:1em;">Order Summary</h3>
        ${cart.map(c=>{ const p=products.find(x=>x.id===c.id); return p?`<div class="flex-between"><span>${escapeHtml(p.name)} × ${c.qty}</span><span>${money(p.price*c.qty)}</span></div>`:''; }).join('')}
        <div class="total-line"><span>Total</span><span>${money(cartTotal())}</span></div>
      </div>
    </div>`;
  }

  function viewOrderSuccess(){
    let o = null;
    try{ o = JSON.parse(sessionStorage.getItem('svf_last_order') || 'null'); }catch(e){}
    if(!o) return `<div class="empty">No recent order. <a href="#/">Go to shop</a></div>`;
    const msg = o.payment === 'whatsapp'
      ? 'Your order has been received. If WhatsApp did not open, tap the button below and press Send so we can confirm with you.'
      : o.payment === 'cod'
        ? 'Your Cash on Delivery order has been received. We will contact you shortly to confirm.'
        : 'Your order has been received. We will share the payment details shortly.';
    return `
    <div class="panel" style="max-width:500px;margin:2em auto;text-align:center;">
      <h2 style="color:var(--ok)">Order Placed!</h2>
      <p>Order ID: <b>${escapeHtml(o.id)}</b></p>
      <p>${msg}</p>
      ${o.waUrl ? `<p><a class="btn wa" href="${escapeHtml(o.waUrl)}" target="_blank" rel="noopener">Send on WhatsApp</a></p>` : ''}
      <a href="#/" class="btn" style="margin-top:.5em;">Continue Shopping</a>
    </div>`;
  }

  /* ---------- Handlers ---------- */
  function attachHandlers(){
    document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToCart(b.dataset.add));
    document.querySelectorAll('[data-qty-plus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.qtyPlus,1));
    document.querySelectorAll('[data-qty-minus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.qtyMinus,-1));
    const placeBtn = document.querySelector('[data-place-order]');
    if(placeBtn) placeBtn.onclick = ()=>go('/checkout');
    document.querySelectorAll('.pay-opt').forEach(el=>{
      el.onclick = ()=>{
        document.querySelectorAll('.pay-opt').forEach(x=>x.classList.remove('selected'));
        el.classList.add('selected');
        el.querySelector('input').checked = true;
      };
    });
    const confirmBtn = document.querySelector('[data-confirm-order]');
    if(confirmBtn) confirmBtn.onclick = handleConfirmOrder;
  }

  async function handleConfirmOrder(){
    const name = document.getElementById('ck-name').value.trim();
    const phone = document.getElementById('ck-phone').value.trim();
    const address = document.getElementById('ck-address').value.trim();
    const payment = document.querySelector('input[name="pay"]:checked').value;
    if(!name || !phone || !address){ toast('Please fill all delivery details'); return; }
    if(!/^\d{10}$/.test(phone)){ toast('Enter a valid 10-digit phone number'); return; }

    // final stock check against live data
    for(const c of cart){
      const p = products.find(x=>x.id===c.id);
      if(!p || p.stock < c.qty){ toast(`Sorry, "${p ? p.name : 'an item'}" is no longer available in that quantity`); return; }
    }

    const items = cart.map(c=>{ const p = products.find(x=>x.id===c.id); return { id:p.id, name:p.name, qty:c.qty, price:p.price }; });
    const total = cartTotal();
    const orderRef = doc(collection(db,'orders'));
    const shortId = orderRef.id.slice(0,8).toUpperCase();

    let waUrl = '';
    if(payment === 'whatsapp'){
      let msg = `Hello ${settings.shopName}, I would like to place an order.\n`;
      msg += `Order ID: ${shortId}\nOrder:\n`;
      items.forEach(i=> msg += `${i.name} × ${i.qty}\n`);
      msg += `Total: ${money(total)}\nName: ${name}\nPhone: ${phone}\nAddress: ${address}`;
      const number = (settings.whatsapp || '').replace(/\D/g,'');
      waUrl = `https://wa.me/${number}?text=${encodeURIComponent(msg)}`;
    }

    // open the tab now (inside the click) so mobile browsers don't block it
    const popup = (payment === 'whatsapp' && settings.whatsapp) ? window.open('', '_blank') : null;

    const btn = document.querySelector('[data-confirm-order]');
    btn.disabled = true; btn.textContent = 'Placing order…';

    try{
      await setDoc(orderRef, {
        name, phone, address, payment, items, total,
        status:'Pending', stockDeducted:false, time: serverTimestamp()
      });
    }catch(e){
      console.error(e);
      if(popup) popup.close();
      toast('Could not place the order. Please try again.');
      btn.disabled = false; btn.textContent = 'Confirm Order';
      return;
    }

    try{ sessionStorage.setItem('svf_last_order', JSON.stringify({ id:shortId, payment, waUrl: settings.whatsapp ? waUrl : '' })); }catch(e){}
    cart = []; saveCart();
    if(popup) popup.location.href = waUrl;
    go('/order-success');
  }

  render();
}
</script>
</body>
</html>
